# Nginx: termina HTTPS, limita peticiones y entrega los archivos estáticos.
limit_req_zone $binary_remote_addr zone=login:10m rate=30r/m;

server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/nuam.crt;
    ssl_certificate_key /etc/nginx/ssl/nuam.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 5m;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location /static/ {
        alias /opt/nuam/app/staticfiles/;
        expires 7d;
    }

    location /cuenta/ingresar/ {
        limit_req zone=login burst=10 nodelay;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://127.0.0.1:8000;
    }
}
