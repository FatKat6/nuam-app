{% extends "base.html" %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block contenido %}
<div class="row justify-content-center" style="margin-top: 12vh">
  <div class="col-sm-8 col-md-5 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-1" style="color: var(--nuam)">nuam</h1>
        <p class="text-muted mb-4">Mantenedor de Calificaciones Tributarias</p>
        <form method="post" novalidate>
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label" for="{{ form.usuario.id_for_label }}">Usuario</label>
            {{ form.usuario }}
          </div>
          <div class="mb-4">
            <label class="form-label" for="{{ form.clave.id_for_label }}">Contraseña</label>
            {{ form.clave }}
          </div>
          <button class="btn btn-nuam w-100" type="submit">Ingresar</button>
        </form>
      </div>
    </div>
    <p class="text-center text-muted small mt-3">Acceso solo para usuarios autorizados de cada corredora.</p>
  </div>
</div>
{% endblock %}
